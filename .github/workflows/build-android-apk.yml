name: Build Pulse Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pulse-android-source.zip"
      - ".github/workflows/build-android-apk.yml"
permissions:
  contents: read
jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack Android project
        run: |
          mkdir -p android-app
          unzip -q pulse-android-source.zip -d android-app
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Attach APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
