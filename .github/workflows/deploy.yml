name: Deploy Pulse Messenger to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip pulse-source.zip -d source
      - name: Apply repository source overrides
        run: |
          if [ -f App.jsx ]; then cp App.jsx source/src/App.jsx; fi
          if [ -f styles.css ]; then cp styles.css source/src/styles.css; fi
          if [ -f database.rules.json ]; then cp database.rules.json source/database.rules.json; fi
          if [ -f README.md ]; then cp README.md source/README.md; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run build
        working-directory: source
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
